<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>v-bind — Козлов А.Д.</title>
</head>
<body>
<script src="vue.global.js"></script>

<div id="app">
    <table :border="tableBorder"
           :cellspacing="tableSpacing"
           :cellpadding="tablePadding"
           :style="{ width: tableWidth + 'px', height: tableHeight + 'px' }">
        <tr>
            <td>Ширина: {{ tableWidth }} px</td>
            <td>Высота: {{ tableHeight }} px</td>
        </tr>
        <tr>
            <td>Внеш. отступ: {{ tableSpacing }} px</td>
            <td>Внутр. отступ: {{ tablePadding }} px</td>
        </tr>
    </table>
</div>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const tableWidth = ref(400);
            const tableHeight = ref(150);
            const tableSpacing = ref(10);
            const tablePadding = ref(20);
            const tableBorder = ref(1);

            return {
                tableWidth,
                tableHeight,
                tableSpacing,
                tablePadding,
                tableBorder
            };
        }
    }).mount('#app');
</script>
</body>
</html>
